name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webui/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: webui
        run: pytest webui/tests -v

      - name: Run MCP Agent Evaluation
        run: |
          echo "Trigger MCP agent evaluation for diagnostix"
